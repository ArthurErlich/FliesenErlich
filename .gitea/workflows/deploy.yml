name: Deploy

on:
  push:
    branches:
      - main
      - staging

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set SITE_URL (main)
        if: github.ref == 'refs/heads/main'
        run: echo "SITE_URL=${{ vars.PROD_URL }}" >> $GITHUB_ENV

      - name: Set SITE_URL (staging)
        if: github.ref == 'refs/heads/staging'
        run: echo "SITE_URL=${{ vars.STAGING_URL }}" >> $GITHUB_ENV

      - name: Build
        run: bun run build
        env:
          SITE_URL: ${{ env.SITE_URL }}

      - name: Archive dist
        run: tar -czf dist.tar.gz dist/

      - name: Upload dist
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist.tar.gz

  deploy-main:
    name: Deploy to Main
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v3
        with:
          name: dist

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SCP + SSH
        run: |
          scp -i ~/.ssh/id_rsa dist.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/dist.tar.gz
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            rm -rf ${{ vars.PROD_DEPLOY_PATH }}/* &&
            tar -xzf /tmp/dist.tar.gz -C ${{ vars.PROD_DEPLOY_PATH }} --strip-components=1 &&
            rm /tmp/dist.tar.gz
          "

  deploy-staging:
    name: Deploy to Staging
    needs: build
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v3
        with:
          name: dist

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SCP + SSH
        run: |
          scp -i ~/.ssh/id_rsa dist.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/dist.tar.gz
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            rm -rf ${{ vars.STAGING_DEPLOY_PATH }}/* &&
            tar -xzf /tmp/dist.tar.gz -C ${{ vars.STAGING_DEPLOY_PATH }} --strip-components=1 &&
            rm /tmp/dist.tar.gz
          "
