services:
  web:
    build: ./docker
    user: "${UID}:${GID}"
    volumes:
      - ./web:/var/www/html
      - ./repository:/var/www/repository:ro
    ports:
      - 80:80
      - 8080:8080
    environment:
      - USER_ID=${UID}
      - GROUP_ID=${GID}

